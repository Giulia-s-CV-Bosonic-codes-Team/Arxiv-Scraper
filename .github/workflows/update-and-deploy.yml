name: Update data and deploy site

on:
  schedule:
    # 07:00 UTC: arXiv announces the day's quant-ph batch at 01:00 UTC (20:00 ET),
    # so by morning in Europe the data is already fresh.
    - cron: "0 7 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The scraper is stdlib-only, so there is nothing to install.
      - name: Fetch the last 35 days of quant-ph
        run: python scraper/fetch_arxiv.py --days 35 --out docs/data/papers.json

      # Pages serves assets with max-age=600, so for ten minutes after a deploy
      # a browser can pair a cached app.js with a fresh index.html. Stamping the
      # commit sha onto the asset URLs makes each deploy fetch its own pair.
      - name: Stamp asset versions with the commit sha
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" docs/index.html

      # upload-pages-artifact and deploy-pages must stay on matching majors:
      # an older uploader writes artifact metadata the newer deployer cannot
      # read, which surfaces as "No artifacts named github-pages were found".
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
